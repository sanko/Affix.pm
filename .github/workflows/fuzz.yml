---
jobs:
  fuzz:
    name: '${{ matrix.title }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.43.0
        with:
          distribution: "${{ matrix.distribution || 'default' }}"
          perl-version: "5.42"
      - name: Install dependencies
        run: |
          cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -q .
          cpanm -v .
          perl Build.PL
          perl Build
      # On Windows the default shell (pwsh) resolves `perl` to the Strawberry Perl
      # added to PATH. Git Bash would resolve it to the MSYS perl bundled with Git,
      # which cannot load the XS module built by Strawberry Perl, so we never use
      # `shell: bash` here on Windows.
      - name: Run fuzzer (Windows)
        if: inputs.fuzzer != 'all' && runner.os == 'Windows'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          $env:FUZZ_MAX_ITER = [int]($env:MINUTES) * 200
          perl -Ilib fuzz/${{ inputs.fuzzer || 'fuzz_shared_lib' }}.pl
      - name: Run fuzzer (Unix)
        if: inputs.fuzzer != 'all' && runner.os != 'Windows'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          FUZZ_MAX_ITER=$(( MINUTES * 200 ))
          perl -Ilib fuzz/${{ inputs.fuzzer || 'fuzz_shared_lib' }}.pl
      - name: Run all fuzzers (Windows)
        if: inputs.fuzzer == 'all' && runner.os == 'Windows'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          $env:FUZZ_MAX_ITER = [int]($env:MINUTES) * 200
          Get-ChildItem fuzz/fuzz_*.pl | Sort-Object Name | ForEach-Object {
            Write-Output "=== Running $_ ==="
            & perl -Ilib $_
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Run all fuzzers (Unix)
        if: inputs.fuzzer == 'all' && runner.os != 'Windows'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          FUZZ_MAX_ITER=$(( MINUTES * 200 ))
          for f in fuzz/fuzz_*.pl; do
            echo "=== Running $f ==="
            perl -Ilib "$f" || exit 1
          done
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            title: Linux x64
          - os: ubuntu-24.04-arm
            title: Linux ARM64
          - os: macos-15
            title: macOS ARM
          - os: macos-15-intel
            title: macOS Intel
          - os: windows-2022
            title: Windows x64
            distribution: strawberry
  riscv:
    name: Linux RISC-V
    runs-on: ubuntu-24.04-riscv
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - id: cache-perl
        name: Check Perl Cache
        uses: actions/cache@v6.1.0
        with:
          key: riscv-fuzz-perl-v5.40.2
          path: ~/perl5/
      - if: "${{ steps.cache-perl.outputs.cache-hit != 'true' }}"
        name: Build Perl 5.40.2 from source
        run: |
          \curl -L https://install.perlbrew.pl | bash
          source ~/perl5/perlbrew/etc/bashrc

          perlbrew self-upgrade
          perlbrew install-patchperl
          perlbrew install-cpanm
          cpanm --local-lib=~/perl5 local::lib && eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
          cpanm -n -v Devel::PatchPerl

          perlbrew install --switch --verbose --as 'fuzz-riscv' -j 8 --notest --noman perl-5.40.2
      - name: Install dependencies
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use fuzz-riscv
          cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -q .
          perl Build.PL
          perl Build
        shell: bash
      - name: Run fuzzer
        if: inputs.fuzzer != 'all'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use fuzz-riscv
          FUZZ_MAX_ITER=$(( MINUTES * 200 ))
          perl -Ilib fuzz/${{ inputs.fuzzer || 'fuzz_shared_lib' }}.pl
        shell: bash
      - name: Run all fuzzers
        if: inputs.fuzzer == 'all'
        env:
          MINUTES: '${{ inputs.minutes || 10 }}'
          FUZZ_TIMEOUT: '5'
          FUZZ_VERBOSE: '0'
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew use fuzz-riscv
          FUZZ_MAX_ITER=$(( MINUTES * 200 ))
          for f in fuzz/fuzz_*.pl; do
            echo "=== Running $f ==="
            perl -Ilib "$f" || exit 1
          done
        shell: bash
name: Fuzz
on:
  schedule:
    - cron: 0 6 * * *
  workflow_dispatch:
    inputs:
      fuzzer:
        description: Which fuzzer to run
        default: fuzz_shared_lib
        required: false
        type: choice
        options:
          - all
          - fuzz_shared_lib
          - fuzz_compile_ok
          - fuzz_cross_boundary
          - fuzz_grammar_mutate
          - fuzz_register_types
          - fuzz_wrap_type_sig
      minutes:
        default: 10
        description: Fuzzing time per runner (approximate)
        required: false
        type: number
permissions:
  contents: read
