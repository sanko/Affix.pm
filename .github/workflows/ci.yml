          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Doptimize=-g","variant":"optimize-g","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-DDEBUGGING=none","variant":"debugging-none","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-UDEBUGGING","variant":"nodebugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Dusethreads -DDEBUGGING=both","variant":"threads-debugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Dusethreads -Duselongdouble -DDEBUGGING=both","variant":"threads-longdouble-debugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Dusethreads -Dusequadmath -DDEBUGGING=both","variant":"threads-quadmath-debugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
