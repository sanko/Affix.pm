          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.40.2","configure":"-Dusethreads -Dusequadmath -DDEBUGGING=both","variant":"threads-quadmath-debugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","variant":"default","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Dusethreads","variant":"threads","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Duselongdouble","variant":"longdouble","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-Dusequadmath","variant":"quadmath","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-DDEBUGGING","variant":"debug","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
          {"prepare":"sudo apt-get update -y && sudo apt-get install -y valgrind build-essential libperl-dev libxcrypt-dev","arch":"x86_64","perl_version":"5.42.0","configure":"-DDEBUGGING=both","variant":"debugging","platform_name":"linux","os":"ubuntu-24.04","toolchain":"gcc"},
