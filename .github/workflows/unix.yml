---
jobs:
  build:
    name: "${{ inputs.flags == '-Dusethreads' && 'Threads' || inputs.flags == '-Duselongdouble' && 'Long Double' || inputs.flags == '-Dusequadmath' && 'Quad Math' || inputs.flags == '--debug' && 'Debugging' || inputs.flags == '' && 'Default' || inputs.flags }}"
    runs-on: '${{ inputs.os }}'
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          submodules: true
      - id: build-name
        name: Compute build name
        run: |
          slug="$(printf '%s' '${{ inputs.flags }}' | tr ' ' '-')"
          echo "perl-name=cache-${{ inputs.os }}-${{ inputs.perl }}$slug" >> "$GITHUB_OUTPUT"
          echo "cache-key=${{ inputs.os }}-perl-v${{ inputs.perl }}$slug" >> "$GITHUB_OUTPUT"
          echo "artifact=test-output-${{ inputs.os }}-${{ inputs.perl }}$slug" >> "$GITHUB_OUTPUT"
        shell: bash
      - id: cache-perl
        name: Check perl Cache
        uses: actions/cache@v6.1.0
        with:
          key: '${{ steps.build-name.outputs.cache-key }}'
          path: '~/perl5/'
      - if: "${{ steps.cache-perl.outputs.cache-hit != 'true' }}"
        name: 'Build perl ${{ inputs.perl }} from source'
        run: |
          \curl -L https://install.perlbrew.pl | bash
          source ~/perl5/perlbrew/etc/bashrc

          perlbrew self-upgrade
          perlbrew install-patchperl
          perlbrew available
          perlbrew install-cpanm
          cpanm --local-lib=~/perl5 local::lib && eval $(perl -I ~/perl5/lib/perl5/ -Mlocal::lib)
          cpanm -n -v Devel::PatchPerl

          perlbrew install --switch --verbose --as '${{ steps.build-name.outputs.perl-name }}' -j 12 --notest --noman ${{ inputs.flags }} perl-${{ inputs.perl }}
      - name: Install prereqs
        run: |
          if [[ $(uname -o) == GNU/Linux ]]; then
            sudo apt-get update -y
            if apt-cache show valgrind >/dev/null 2>&1; then
              sudo apt-get install -y valgrind
            fi
          fi
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew switch '${{ steps.build-name.outputs.perl-name }}'
          cpanm --installdeps --notest --with-suggests --with-recommends --with-configure -v .
        shell: bash
      - env:
          AUTHOR_TESTING: 0
          AUTOMATED_TESTING: 1
        id: test
        name: Run test suite
        run: |
          source ~/perl5/perlbrew/etc/bashrc
          perlbrew switch '${{ steps.build-name.outputs.perl-name }}'
          perl -V
          perl Build.PL
          ./Build
          ./Build test --v
          command1_exit_code=$?
          if [ $command1_exit_code -eq 0 ]; then
            ~/perl5/perlbrew/perls/'${{ steps.build-name.outputs.perl-name }}'/bin/perl -V > '${{ steps.build-name.outputs.artifact }}'.txt
            command2_exit_code=$?
          else
            echo "Error!" > '${{ steps.build-name.outputs.artifact }}'.txt
            exit $command1_exit_code
          fi
        shell: bash
      - name: Upload results as artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          if-no-files-found: error
          name: '${{ steps.build-name.outputs.artifact }}'
          path: '${{ steps.build-name.outputs.artifact }}.txt'
          retention-days: 1
name: inputs module
on:
  workflow_call:
    inputs:
      flags:
        required: false
        type: string
      os:
        required: true
        type: string
      perl:
        required: true
        type: string
